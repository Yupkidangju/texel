[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "texel-tui"
version = "0.3.1"
description = "An offline terminal spreadsheet with shared, revision-safe MCP analysis tools"
requires-python = ">=3.14"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{email = "yupkidangju@gmail.com"}]

dependencies = [
  "textual==8.2.8",
  "openpyxl==3.1.5",
  "xlrd==2.0.2",
  "defusedxml==0.7.1",
  "mcp==2.3.0",
  "pydantic==2.14.0",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "pytest-asyncio>=1.0,<2", "ruff==0.17.0", "hatchling>=1.27", "xlwt==1.3.0"]

[project.urls]
Repository = "https://github.com/Yupkidangju/texel"
Issues = "https://github.com/Yupkidangju/texel/issues"

[project.scripts]
texel = "texel.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["texel"]

[tool.hatch.build]
directory = "output"

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [
  "*.egg", ".*", "_darcs", "build", "CVS", "dist", "node_modules", "venv", "{arch}",
  "docs", "output",
]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py314"
line-length = 100
include = [
  "texel/**/*.py", "texel/**/*.pyi", "texel/**/*.ipynb",
  "tests/**/*.py", "tests/**/*.pyi", "tests/**/*.ipynb",
  "scripts/**/*.py", "scripts/**/*.pyi", "scripts/**/*.ipynb",
]
extend-exclude = ["docs", ".runtime", ".cache", "output", "build"]
force-exclude = true

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
