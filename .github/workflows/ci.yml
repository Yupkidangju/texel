name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: ${{ matrix.os }} / ${{ matrix.arch }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows-2025, arch: x64, python: '3.14'}
          - {os: windows-11-arm, arch: x64, python: '3.14'} # OS x64 emulation
          - {os: ubuntu-24.04, arch: x64, python: '3.14'}
          - {os: ubuntu-24.04-arm, arch: arm64, python: '3.14'}
          - {os: macos-15-intel, arch: x64, python: '3.14'}
          - {os: macos-15, arch: arm64, python: '3.14'}
          - {os: ubuntu-24.04, arch: x64, python: '3.15'}
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      TERM: xterm-256color
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          architecture: ${{ matrix.arch }}
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install locked development dependencies
        run: python -m pip install -r requirements.lock
      - name: Initialize clean-checkout working directory
        run: python -c "from pathlib import Path; Path('.cache').mkdir(exist_ok=True)"
      - name: Release metadata and tag gate
        run: python scripts/check_release.py
      - name: Ruff check
        run: python -m ruff check texel tests scripts
      - name: Ruff format
        run: python -m ruff format --check texel tests scripts
      - name: Full regression suite
        run: python -m pytest -q --basetemp .cache/pytest-ci --junitxml=.cache/test-results.xml
      - name: Build wheel and source distribution
        run: python -m hatchling build
      - name: Verify licenses and isolated wheel CLI/UI/MCP stdio
        run: python scripts/verify_release.py --evidence .cache/wheel-check
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages-${{ matrix.os }}-${{ matrix.python }}
          path: |
            output/*.whl
            output/*.tar.gz
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: reports-${{ matrix.os }}-${{ matrix.python }}
          path: |
            .cache/test-results.xml
            .cache/wheel-check/public_paths/result.json
            .cache/wheel-check/package.json
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 14
